<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mechanic Dashboard - Emergency Mechanic</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="dashboard-wrapper">
        <nav class="navbar">
            <div class="navbar-brand">
                <h2>🔧 Mechanic Dashboard</h2>
            </div>
            <div class="navbar-menu">
                <a href="#" class="nav-link">Dashboard</a>
                <a href="about.html" class="nav-link">About</a>
                <span id="mechanicNameDisplay" class="nav-user"></span>
                <button id="logoutBtn" class="btn btn-secondary">Logout</button>
            </div>
        </nav>

        <div class="container">
            <div class="dashboard-grid">
                <!-- Map Panel -->
                <div class="full-width">
                    <div class="card">
                        <h3>Live Map</h3>
                        <div id="map" style="height: 400px; border-radius: 8px;"></div>
                    </div>
                </div>

                <!-- Active Requests -->
                <div class="left-panel">
                    <div class="card">
                        <h3>Active Requests</h3>
                        <div class="button-group">
                            <button id="startTrackingBtn" class="btn btn-primary">Start Tracking</button>
                            <button id="stopTrackingBtn" class="btn btn-secondary" disabled>Stop Tracking</button>
                        </div>
                        <div id="requestsContainer">
                            <p class="no-data">No active requests</p>
                        </div>
                    </div>
                </div>

                <!-- Statistics -->
                <div class="right-panel">
                    <div class="card">
                        <h3>Statistics</h3>
                        <div class="stat-item">
                            <span>Total Requests Accepted:</span>
                            <strong id="totalRequests">0</strong>
                        </div>
                        <div class="stat-item">
                            <span>Completed Today:</span>
                            <strong id="completedToday">0</strong>
                        </div>
                        <div class="stat-item">
                            <span>Rating:</span>
                            <strong id="mechanicRating">4.5/5</strong>
                        </div>
                    </div>

                    <div class="card">
                        <h3>Earnings</h3>
                        <div class="stat-item">
                            <span>Today's Earnings:</span>
                            <strong id="todayEarnings">$0.00</strong>
                        </div>
                        <div class="stat-item">
                            <span>Total Earnings:</span>
                            <strong id="totalEarnings">$0.00</strong>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.socket.io/4.6.1/socket.io.min.js"></script>
    <script src="js/mechanic.js"></script>
</body>
</html>
