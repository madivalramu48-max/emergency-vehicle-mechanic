<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emergency Mechanic - Login</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-page">
    <div class="login-container">
        <div class="login-box">
            <div class="login-header">
                <h1>🚗 Emergency Mechanic</h1>
                <p>Roadside Assistance Service</p>
            </div>

            <div class="tabs">
                <button class="tab-btn active" data-tab="login-tab">Login</button>
                <button class="tab-btn" data-tab="register-tab">Register</button>
            </div>

            <!-- Login Form -->
            <div id="login-tab" class="tab-content active">
                <form id="loginForm">
                    <div class="form-group">
                        <label for="loginEmail">Email Address</label>
                        <input type="email" id="loginEmail" placeholder="your@email.com" required>
                    </div>

                    <div class="form-group">
                        <label for="loginPassword">Password</label>
                        <input type="password" id="loginPassword" placeholder="Enter password" required>
                    </div>

                    <div class="form-group">
                        <label for="userRole">Login As</label>
                        <select id="userRole" required>
                            <option value="">Select Role</option>
                            <option value="user">User (Customer)</option>
                            <option value="mechanic">Mechanic</option>
                            <option value="admin">Admin</option>
                        </select>
                    </div>

                    <button type="submit" class="btn btn-primary">Login</button>
                    <div id="loginError" class="error-message"></div>
                </form>
            </div>

            <!-- Register Form -->
            <div id="register-tab" class="tab-content">
                <form id="registerForm">
                    <div class="form-group">
                        <label for="regName">Full Name</label>
                        <input type="text" id="regName" placeholder="Your name" required>
                    </div>

                    <div class="form-group">
                        <label for="regEmail">Email Address</label>
                        <input type="email" id="regEmail" placeholder="your@email.com" required>
                    </div>

                    <div class="form-group">
                        <label for="regPhone">Phone Number</label>
                        <input type="tel" id="regPhone" placeholder="+1 234 567 8900" required>
                    </div>

                    <div class="form-group">
                        <label for="regPassword">Password</label>
                        <input type="password" id="regPassword" placeholder="Create password" required>
                    </div>

                    <div class="form-group">
                        <label for="regRole">Register As</label>
                        <select id="regRole" required>
                            <option value="">Select Role</option>
                            <option value="user">User (Customer)</option>
                            <option value="mechanic">Mechanic</option>
                        </select>
                    </div>

                    <button type="submit" class="btn btn-primary">Register</button>
                    <div id="registerError" class="error-message"></div>
                </form>
            </div>

            <div class="login-footer">
                <p>Need help? <a href="about.html">Learn more about us</a></p>
            </div>
        </div>
    </div>

    <script src="js/login.js"></script>
</body>
</html>
